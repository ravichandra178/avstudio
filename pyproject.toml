[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-studio"
version = "0.1.0"
description = "PDF-to-knowledge-graph learning platform"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=5.25,<6",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
cloud = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
include = ["learning_studio*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
