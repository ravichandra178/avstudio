name: PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  models: read
  pull-requests: write

jobs:
  ai-review:
    name: Review pull request
    runs-on: ubuntu-latest
    steps:
      - name: Generate and post AI review
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const pull = context.payload.pull_request;

            const diffResponse = await github.request(
              "GET /repos/{owner}/{repo}/pulls/{pull_number}",
              {
                owner,
                repo,
                pull_number: pullNumber,
                headers: { accept: "application/vnd.github.v3.diff" },
              }
            );
            const diff = String(diffResponse.data).slice(0, 100000);

            if (!diff.trim()) {
              core.info("The pull request has no diff to review.");
              return;
            }

            const prompt = [
              "Perform a complete, evidence-based pull request review.",
              "Do not invent issues. Distinguish confirmed problems from recommendations.",
              "Always include every section below:",
              "1. Summary of the change.",
              "2. Actionable findings, each with severity (critical, high, medium, or low), file, line if available, impact, confidence, and fix.",
              "3. Security risks and privacy concerns.",
              "4. Mermaid flowchart showing the changed code or data flow.",
              "5. Test coverage and specific recommended tests.",
              "6. Performance, reliability, maintainability, and deployment risks.",
              "7. Improvement options with trade-offs.",
              "8. Final verdict: approve, request changes, or needs manual review.",
              "If there are no actionable findings, write exactly: No actionable findings.",
              "Put the flowchart in a fenced ```mermaid code block.",
              "",
              `PR title: ${pull.title}`,
              `PR description: ${pull.body || "(none)"}`,
              "",
              "PR diff:",
              diff,
            ].join("\n");

            const modelResponse = await fetch(
              "https://models.inference.ai.azure.com/chat/completions",
              {
                method: "POST",
                headers: {
                  authorization: "Bearer " + process.env.GITHUB_TOKEN,
                  "content-type": "application/json",
                },
                body: JSON.stringify({
                  model: "gpt-4o-mini",
                  messages: [
                    {
                      role: "system",
                      content: "You are a precise senior code-review assistant.",
                    },
                    { role: "user", content: prompt },
                  ],
                  temperature: 0,
                  max_tokens: 4000,
                }),
              }
            );

            if (!modelResponse.ok) {
              throw new Error(
                `GitHub Models request failed (${modelResponse.status}): ${await modelResponse.text()}`
              );
            }

            const result = await modelResponse.json();
            const review = result.choices?.[0]?.message?.content?.trim();
            if (!review) {
              throw new Error("GitHub Models returned an empty review.");
            }

            const marker = "<!-- full-ai-pr-review -->";
            const body = `${marker}\n## Full AI PR review\n\n${review}\n\n---\n*Generated by GitHub Models.*`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
